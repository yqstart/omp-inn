<!--
  omp-inn 应用图标 · 唯一矢量源
  以黑色圆角底板和定制 π 字标呈现，字标使用蓝紫粉渐变与细微光泽。
  底板遵循桌面图标网格；字标使用统一轮廓，确保小尺寸下清晰。
  运行 pnpm icon 生成桌面与手机远程端图标。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#303030"/>
      <stop offset="0.42" stop-color="#191919"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="light" cx="0.24" cy="0.06" r="0.88">
      <stop stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#82ddf5"/>
      <stop offset="0.42" stop-color="#91aaff"/>
      <stop offset="0.72" stop-color="#b399f8"/>
      <stop offset="1" stop-color="#eca6c9"/>
    </linearGradient>
    <path id="pi" d="M 312 314 H 712 A 48 48 0 0 1 712 410 H 654 Q 634 410 634 430 V 666 A 48 48 0 0 1 538 666 V 430 Q 538 410 518 410 H 506 Q 486 410 486 430 V 666 A 48 48 0 0 1 390 666 V 430 Q 390 410 370 410 H 312 A 48 48 0 0 1 312 314 Z"/>
  </defs>

  <!-- 黑色底板，边缘与光泽只使用中性灰 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#background)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#light)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="4"/>
  <rect x="109" y="109" width="806" height="806" rx="178" fill="none" stroke="#000" stroke-opacity="0.24" stroke-width="2"/>

  <!-- 单一轮廓的定制字标，圆滑过渡与柔和投影 -->
  <use href="#pi" transform="translate(0 12)" fill="#000" opacity="0.3"/>
  <use href="#pi" fill="url(#mark)"/>
</svg>
